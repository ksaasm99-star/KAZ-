name: KAZ Secret Scan

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kaz-gitleaks-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare report directory
        run: mkdir -p security-reports

      - name: Scan Pull Request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.30.0 \
            git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path /repo/security-reports/gitleaks.sarif \
            --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"

      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaz-gitleaks-report-${{ github.run_id }}
          path: security-reports/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14
