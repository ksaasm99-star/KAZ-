name: Build KAZ APK

run-name: KAZ APK build — ${{ github.event.client_payload.requestId || inputs.requestId || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      projectId:
        description: "KAZ project ID"
        required: true
        type: string
      requestId:
        description: "KAZ factory request ID"
        required: true
        type: string
      inputDigest:
        description: "Expected project payload digest"
        required: true
        type: string
      artifactName:
        description: "APK artifact name"
        required: true
        type: string
  repository_dispatch:
    types: [kaz-build]

permissions:
  contents: read

concurrency:
  group: kaz-apk-build-${{ github.event.client_payload.requestId || inputs.requestId || github.run_id }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch private project payload
        env:
          PROJECT_ID: ${{ github.event.client_payload.projectId || inputs.projectId }}
          REQUEST_ID: ${{ github.event.client_payload.requestId || inputs.requestId }}
          EXPECTED_INPUT_DIGEST: ${{ github.event.client_payload.inputDigest || inputs.inputDigest }}
          ARTIFACT_NAME: ${{ github.event.client_payload.artifactName || inputs.artifactName }}
          KAZ_PAYLOAD_URL: ${{ vars.KAZ_PAYLOAD_URL }}
          KAZ_OWNER_TOKEN: ${{ secrets.KAZ_OWNER_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import html
          import json
          import os
          import re
          import pathlib
          import urllib.parse
          import urllib.request

          base_url = os.environ.get('KAZ_PAYLOAD_URL', '').strip()
          token = os.environ.get('KAZ_OWNER_TOKEN', '').strip()
          project_id = os.environ.get('PROJECT_ID', '').strip()
          if not base_url or not token or not project_id:
              raise SystemExit('KAZ_PAYLOAD_URL, KAZ_OWNER_TOKEN and PROJECT_ID are required')
          query = urllib.parse.urlencode({'projectId': project_id})
          request = urllib.request.Request(f"{base_url.rstrip('/')}/api/factory/payload?{query}", headers={'Accept': 'application/json', 'Authorization': f'Bearer {token}'})
          with urllib.request.urlopen(request, timeout=10) as response:
              payload = json.load(response)
          if payload.get('projectId') != project_id:
              raise SystemExit('PROJECT_ID_MISMATCH')
          raw = base64.b64decode(payload.get('project_json_b64', ''), validate=True)
          actual_digest = 'sha256:' + hashlib.sha256(raw).hexdigest()
          if actual_digest != os.environ.get('EXPECTED_INPUT_DIGEST', '').strip() or actual_digest != payload.get('inputDigest'):
              raise SystemExit('INPUT_DIGEST_MISMATCH')
          artifact_name = os.environ.get('ARTIFACT_NAME', '').strip()
          if not re.fullmatch(r'[A-Za-z0-9_-]+\.apk', artifact_name):
              raise SystemExit('INVALID_ARTIFACT_NAME')
          pathlib.Path('build-output').mkdir(exist_ok=True)
          pathlib.Path('build-output/project.json').write_bytes(raw)
          pathlib.Path('build-output/input-digest.txt').write_text(actual_digest, encoding='utf-8')
          pathlib.Path('build-output/project-id.txt').write_text(project_id, encoding='utf-8')
          pathlib.Path('build-output/artifact-name.txt').write_text(artifact_name, encoding='utf-8')
          project = json.loads(raw.decode('utf-8'))
          title = str(project.get('title') or 'KAZ App').strip() or 'KAZ App'
          summary = str(project.get('summary') or '').strip()
          sources = project.get('sources') or []
          knowledge = project.get('knowledge') or []
          safe_title = re.sub(r'[^A-Za-z0-9_\-\u0600-\u06FF]+', '_', title).strip('_') or 'KAZ_App'
          safe_title = safe_title[:48]

          def item_list(items, key):
              return ''.join(f'<li><strong>{html.escape(str(item.get(key, "")))}</strong><br>{html.escape(str(item.get("value", item.get("content", ""))))}</li>' for item in items)

          document = f'''<!doctype html>
          <html lang="ar" dir="rtl">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{html.escape(title)}</title>
          <style>body{{font-family:system-ui,sans-serif;background:#0b1220;color:#edf6ff;margin:0;padding:20px;line-height:1.7}}main{{max-width:720px;margin:auto}}section{{background:#142238;border:1px solid #29415f;border-radius:16px;padding:18px;margin:14px 0}}h1{{color:#7de7e4}}h2{{font-size:17px}}li{{margin:8px 0}}</style></head>
          <body><main><section><h1>{html.escape(title)}</h1><p>{html.escape(summary)}</p></section>
          <section><h2>مصادر المشروع</h2><ul>{item_list(sources, 'name') or '<li>لا توجد مصادر</li>'}</ul></section>
          <section><h2>معرفة المشروع</h2><ul>{item_list(knowledge, 'title') or '<li>لا توجد معرفة</li>'}</ul></section></main></body></html>'''

          root = pathlib.Path('web/factory-template/app/src/main')
          (root / 'assets').mkdir(parents=True, exist_ok=True)
          (root / 'assets/index.html').write_text(document, encoding='utf-8')
          (root / 'res/values/strings.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">'
              + html.escape(title, quote=True) + '</string></resources>', encoding='utf-8')
          pathlib.Path('build-output/build-name.txt').write_text(safe_title, encoding='utf-8')
          print(f'PAYLOAD_FETCHED_FROM_API=true')
          print(f'MATERIALIZED_PROJECT={safe_title}')
          print(f'SOURCES={len(sources)} KNOWLEDGE={len(knowledge)}')
          PY

      - name: Compile Java sources
        id: compile
        working-directory: web/factory-template
        run: ./gradlew --no-daemon --stacktrace :app:compileDebugJavaWithJavac

      - name: Run unit tests
        id: unit_tests
        working-directory: web/factory-template
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run lint
        id: lint
        working-directory: web/factory-template
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        id: build
        working-directory: web/factory-template
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature and native ABI
        id: apk_verification
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          APK="web/factory-template/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK_ROOT" ] || { echo "Android SDK root is unavailable"; exit 1; }
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          [ -x "$APKSIGNER" ] || { echo "apksigner is unavailable at $APKSIGNER"; exit 1; }
          [ -f "$APK" ] || { echo "APK is unavailable at $APK"; exit 1; }
          mkdir -p build-output
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build-output/apksigner.txt
          unzip -Z1 "$APK" | grep '^lib/' | sort -u | tee build-output/abi.txt || true
          if [ ! -s build-output/abi.txt ]; then
            printf 'NO_NATIVE_LIBRARIES\n' | tee build-output/abi.txt
          fi

      - name: Collect build verification evidence
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          APK_VERIFICATION_OUTCOME: ${{ steps.apk_verification.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          from datetime import datetime, timezone

          output = pathlib.Path('build-output')
          output.mkdir(exist_ok=True)
          artifact_source = pathlib.Path('web/factory-template/app/build/outputs/apk/debug/app-debug.apk')
          artifact_sha256 = None
          artifact_path = None
          if artifact_source.is_file():
              artifact_sha256 = __import__('hashlib').sha256(artifact_source.read_bytes()).hexdigest()
              artifact_path = str(artifact_source)
          input_digest = (output / 'input-digest.txt').read_text(encoding='utf-8').strip() if (output / 'input-digest.txt').is_file() else None
          project_id = (output / 'project-id.txt').read_text(encoding='utf-8').strip() if (output / 'project-id.txt').is_file() else 'unknown'
          signature_output = (output / 'apksigner.txt').read_text(encoding='utf-8') if (output / 'apksigner.txt').is_file() else ''
          certificate_match = re.search(r'certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)', signature_output)
          abi_inventory = [line.strip() for line in (output / 'abi.txt').read_text(encoding='utf-8').splitlines()] if (output / 'abi.txt').is_file() else []
          evidence = {
              'projectId': project_id,
              'requestId': os.environ.get('REQUEST_ID', '${{ github.event.client_payload.requestId || inputs.requestId || github.run_id }}'),
              'runId': '${{ github.run_id }}',
              'commitSha': '${{ github.sha }}',
              'inputDigest': input_digest,
              'testResults': [{'name': 'compile', 'status': 'passed' if os.environ.get('COMPILE_OUTCOME') == 'success' else 'failed'}, {'name': 'unitTests', 'status': 'passed' if os.environ.get('UNIT_TESTS_OUTCOME') == 'success' else 'failed'}, {'name': 'lint', 'status': 'passed' if os.environ.get('LINT_OUTCOME') == 'success' else 'failed'}, {'name': 'build', 'status': 'passed' if os.environ.get('BUILD_OUTCOME') == 'success' else 'failed'}],
              'compile': os.environ.get('COMPILE_OUTCOME', 'unknown'),
              'build': os.environ.get('BUILD_OUTCOME', 'unknown'),
              'signatureVerification': os.environ.get('APK_VERIFICATION_OUTCOME', 'unknown'),
              'certificateSha256': certificate_match.group(1) if certificate_match else None,
              'nativeAbi': abi_inventory,
              'artifactPath': artifact_path,
              'artifactSha256': artifact_sha256,
              'recordedAt': datetime.now(timezone.utc).isoformat(),
          }
          (output / 'verification.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, ensure_ascii=False))

      - name: Prepare APK artifact
        id: artifact
        if: steps.build.outcome == 'success'
        run: |
          APK=$(cat build-output/artifact-name.txt)
          cp web/factory-template/app/build/outputs/apk/debug/app-debug.apk "build-output/${APK}"
          sha256sum "build-output/${APK}" | tee "build-output/${APK}.sha256"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaz-apk-${{ github.run_id }}
          path: |
            build-output/*.apk
            build-output/*.sha256
            build-output/apksigner.txt
            build-output/abi.txt
            build-output/verification.json
          if-no-files-found: warn
          retention-days: 14
